name: Release

# 改成 PyO3 之后，本地 `uv publish` 只能传一个本机平台的 wheel，其他平台 pip 装
# 不上（会退化到 sdist 现场编译，要求用户有 Rust 工具链）。所以 wheel 构建和上传
# 全部挪到这里，由 tag 触发；版本自增 / push / tag 仍留在本地 funbuild。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.platform.target }}${{ matrix.platform.manylinux && format(' {0}', matrix.platform.manylinux) || '' }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux 一律钉死 24.04 而不用 ubuntu-latest：该标签从 2026-10-19 起
          # 分批迁往 Ubuntu 26(actions/runner-images#14748)。发版流程不该在
          # 镜像迁移期间碰运气 —— manylinux 基线和 glibc 版本都受影响。
          # 确认 26 上一切正常后再统一改过去。
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          # macos-13 已于 2025-12-04 退役，标签不再解析到 runner —— job 会一直
          # 排队而不是报错。Intel macOS 现在只有 macos-15-intel，它本身也只撑到
          # 2027 秋季，之后 Actions 不再提供 x86_64 macOS。
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # abi3-py312：每个平台一个 wheel 覆盖 3.12 及以后所有版本。
          args: --release --out dist
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}

      # 装一遍再 import，确保产出的不是一个只能构建、装上就崩的 wheel。
      # 交叉编译出来的 wheel 跑不了，跳过。
      - name: Smoke test
        if: matrix.platform.target != 'aarch64-unknown-linux-gnu' && matrix.platform.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index funget
          python -c "import funget; print(funget.download, funget.single_upload)"
          funget --help

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'auto' }}
          path: dist

  # CLI 二进制单独构建：它的价值就在于「不用装 Python」，所以必须是能直接下载
  # 运行的独立文件，而不是藏在 wheel 里。
  binaries:
    name: cli (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-13 已于 2025-12-04 退役，标签不再解析到 runner —— job 会一直
          # 排队而不是报错。Intel macOS 现在只有 macos-15-intel，它本身也只撑到
          # 2027 秋季，之后 Actions 不再提供 x86_64 macOS。
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build
        run: cargo build --release --locked --package funget --target ${{ matrix.platform.target }}

      - name: Rename
        shell: bash
        run: |
          mkdir -p artifacts
          mv "target/${{ matrix.platform.target }}/release/funget${{ matrix.platform.suffix }}" \
             "artifacts/funget-${{ matrix.platform.target }}${{ matrix.platform.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform.target }}
          path: artifacts

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [wheels, binaries, sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # contents: write 给下面那步往 GitHub Release 挂二进制。
      # id-token: write 是 PyPI trusted publishing 要的 OIDC id-token。
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: binaries
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5

      # 用 uv publish 而不是 maturin upload：maturin 的 upload 子命令根本不支持
      # trusted publishing，只认 MATURIN_PYPI_TOKEN / .pypirc。uv 支持 OIDC，
      # 所以这里不再需要长期有效的 PYPI_TOKEN secret。
      #
      # 前置条件：PyPI 项目设置里登记本仓库为 trusted publisher，workflow 填
      # release.yml、environment 留空（本 job 没有 environment:，填了会对不上）。
      #
      # 写 always 而不是默认的 automatic：automatic 在拿不到 id-token 时会静默
      # 退回去找 token，配置错了要等到真实发版才暴露。always 直接失败。
      #
      # --check-url 让重跑变成幂等的：首次发版万一传到一半挂了，重跑会跳过已经
      # 在 PyPI 上的文件，而不是整个失败（PyPI 不允许覆盖同名文件）。
      - name: Publish to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            dist/*

      - name: Attach CLI binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true

  # crates.io 发布。和 PyPI 那边刻意分开成两个 job：crate 的版本线是独立的 0.x，
  # 多数 tag 根本不会动它，所以这个 job 的常态是「全部跳过」而不是「每次都发」。
  crates:
    needs: [wheels, binaries, sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # 只是允许向 GitHub 索要 OIDC id-token。和 uv 不一样，cargo 自己不做 OIDC
      # 交换 —— 必须靠下面那个 action 把 id-token 换成 crates.io 的短期令牌，
      # 再通过 CARGO_REGISTRY_TOKEN 递给 cargo publish。
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # cargo publish 没有 PyPI 的 --check-url 那种幂等开关，版本已存在就硬失败。
      # 所以逐个 crate 先查 crates.io 再决定发不发：
      #   - crate 版本没变的 tag（大多数情况）→ 两个都跳过，job 绿
      #   - 上次发到一半挂了 → 重跑只补没发出去的那个
      # 顺序写死 funget-core 在前：funget 依赖它，而 crates.io 要求被依赖的
      # 版本在上传时已经存在。
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for pkg in funget-core funget; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')"
            if [ -z "${version}" ]; then
              echo "::error::在 cargo metadata 里找不到 ${pkg}"
              exit 1
            fi
            if curl -sfo /dev/null \
                -H 'User-Agent: farfarfun-funget-release' \
                "https://crates.io/api/v1/crates/${pkg}/${version}"; then
              echo "${pkg} ${version} 已在 crates.io，跳过"
              continue
            fi
            echo "发布 ${pkg} ${version}"
            cargo publish -p "${pkg}" --locked
          done
