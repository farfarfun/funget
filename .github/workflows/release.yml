name: Release

# 改成 PyO3 之后，本地 `uv publish` 只能传一个本机平台的 wheel，其他平台 pip 装
# 不上（会退化到 sdist 现场编译，要求用户有 Rust 工具链）。所以 wheel 构建和上传
# 全部挪到这里，由 tag 触发；版本自增 / push / tag 仍留在本地 funbuild。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 版本号只有根 Cargo.toml 这一个来源：二进制自报的版本来自 CARGO_PKG_VERSION，
  # .deb 的 Version 字段和 Homebrew formula 的版本都从这儿取。funbuild 发版时会把
  # pyproject.toml 和这里写成一致，对不上说明发版流程出了岔子——以前没有这道闸。
  check:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        # 根 Cargo.toml 是纯虚拟工作区，第一个行首 `version = ` 就是
        # [workspace.package] 的那个。funget-core 的 0.2.0 写在行内的
        # `{ path = ..., version = ... }` 里，不会被 `^version = ` 匹配到。
        run: |
          set -eu
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml 里读不出 [workspace.package] 的 version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 和 Cargo.toml 里的 ${version} 对不上"
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  wheels:
    name: wheel (${{ matrix.platform.target }}${{ matrix.platform.manylinux && format(' {0}', matrix.platform.manylinux) || '' }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux 一律钉死 24.04 而不用 ubuntu-latest：该标签从 2026-10-19 起
          # 分批迁往 Ubuntu 26(actions/runner-images#14748)。发版流程不该在
          # 镜像迁移期间碰运气 —— manylinux 基线和 glibc 版本都受影响。
          # 确认 26 上一切正常后再统一改过去。
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          # macos-13 已于 2025-12-04 退役，标签不再解析到 runner —— job 会一直
          # 排队而不是报错。Intel macOS 现在只有 macos-15-intel，它本身也只撑到
          # 2027 秋季，之后 Actions 不再提供 x86_64 macOS。
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # abi3-py312：每个平台一个 wheel 覆盖 3.12 及以后所有版本。
          args: --release --out dist
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}

      # 装一遍再 import，确保产出的不是一个只能构建、装上就崩的 wheel。
      # 交叉编译出来的 wheel 跑不了，跳过。
      - name: Smoke test
        if: matrix.platform.target != 'aarch64-unknown-linux-gnu' && matrix.platform.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index funget
          python -c "import funget; print(funget.download, funget.single_upload)"
          funget --help

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'auto' }}
          path: dist

  # CLI 二进制单独构建：它的价值就在于「不用装 Python」，所以必须是能直接下载
  # 运行的独立文件，而不是藏在 wheel 里。
  binaries:
    name: cli (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # gnu 两个 target 保留：musl 静态二进制用 musl 自己的解析器，不走 glibc
          # 的 NSS，靠 mDNS / LDAP / nss-* 插件解析主机名的环境只有 gnu 版能用。
          # README 里 releases/latest/download/funget-x86_64-unknown-linux-gnu
          # 也是公开地址，删掉就 404。
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # musl 全静态：.deb 不写 Depends、Homebrew 的 Linux 瓶子、以及推荐给
          # 老发行版的 tarball 都用它。ubuntu-24.04 编出来的 gnu 二进制链的是
          # glibc 2.39，在 Debian 12（2.36）上根本起不来。funget 是纯 rustls，
          # 没有 OpenSSL，所以静态构建不需要额外的 C 依赖。
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            tarball: "yes"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            tarball: "yes"
          # macos-13 已于 2025-12-04 退役，标签不再解析到 runner —— job 会一直
          # 排队而不是报错。Intel macOS 现在只有 macos-15-intel，它本身也只撑到
          # 2027 秋季，之后 Actions 不再提供 x86_64 macOS。
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            tarball: "yes"
          - runner: macos-latest
            target: aarch64-apple-darwin
            tarball: "yes"
          # Windows 不出 tarball：Homebrew 和 .deb 都用不上它。
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    steps:
      - uses: actions/checkout@v4

      # ring 的 build.rs 要一个 C 编译器，musl-tools 提供的 musl-gcc 会被 cc
      # crate 按 target 三元组自动选中。arm64 用的是原生 arm runner 而不是交叉
      # 编译，所以两边装的都是宿主架构那一份。
      - name: Install musl toolchain
        if: contains(matrix.platform.target, 'musl')
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build
        run: cargo build --release --locked --package funget --target ${{ matrix.platform.target }}

      - name: Package
        shell: bash
        # tarball 必须在这个 job 里打：upload-artifact 不保留文件权限，裸文件到了
        # 下游 job 就是 0644 的，而 Homebrew 的 bin.install 和 .deb 都要可执行位。
        # 里面的文件名得是裸 funget —— formula 和 build-deb.sh 都按裸名取。
        run: |
          set -eu
          mkdir -p artifacts
          if [ -n "${{ matrix.platform.tarball }}" ]; then
            tar -czf "artifacts/funget-${{ matrix.platform.target }}.tar.gz" \
              -C "target/${{ matrix.platform.target }}/release" funget
          fi
          mv "target/${{ matrix.platform.target }}/release/funget${{ matrix.platform.suffix }}" \
             "artifacts/funget-${{ matrix.platform.target }}${{ matrix.platform.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform.target }}
          path: artifacts

  # 打 .deb。不加 tag 条件，workflow_dispatch 时也跑：打包脚本坏了应该在不发版的
  # 时候就红，而不是等到真发版。
  deb:
    name: deb (${{ matrix.arch }})
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-musl }
          - { arch: arm64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: artifacts

      # 跨架构打包没问题：dpkg-deb 只是把文件装进去，Architecture 是 control
      # 里的一个字段，不是构建属性。
      - name: Build .deb
        run: |
          set -eu
          sudo apt-get update -y && sudo apt-get install -y dpkg-dev
          mkdir -p stage
          tar -xzf "artifacts/funget-${{ matrix.target }}.tar.gz" -C stage
          bash packaging/build-deb.sh stage/funget \
            "${{ needs.check.outputs.version }}" "${{ matrix.arch }}" dist

      - name: Inspect
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [check, wheels, binaries, sdist, deb]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # contents: write 给下面那步往 GitHub Release 挂二进制。
      # id-token: write 是 PyPI trusted publishing 要的 OIDC id-token。
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: binaries
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: binaries
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5

      # 用 uv publish 而不是 maturin upload：maturin 的 upload 子命令根本不支持
      # trusted publishing，只认 MATURIN_PYPI_TOKEN / .pypirc。uv 支持 OIDC，
      # 所以这里不再需要长期有效的 PYPI_TOKEN secret。
      #
      # 前置条件：PyPI 项目设置里登记本仓库为 trusted publisher，workflow 填
      # release.yml、environment 留空（本 job 没有 environment:，填了会对不上）。
      #
      # 写 always 而不是默认的 automatic：automatic 在拿不到 id-token 时会静默
      # 退回去找 token，配置错了要等到真实发版才暴露。always 直接失败。
      #
      # --check-url 让重跑变成幂等的：首次发版万一传到一半挂了，重跑会跳过已经
      # 在 PyPI 上的文件，而不是整个失败（PyPI 不允许覆盖同名文件）。
      - name: Publish to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            dist/*

      # 校验和清单最后生成：它要覆盖上面所有附件，提前算就漏掉 .deb 和 tarball。
      # farfarfun/packages 渲染 Homebrew formula 时按裸文件名在这里查 sha256。
      - name: Generate SHA256SUMS
        working-directory: binaries
        # 必须是块标量：单行 run 是 YAML 的普通标量，空格后的 # 会被当成注释，
        # 命令从 sed 的分隔符处被截断。
        #
        # 用 ./* 而不是 *：文件名以 - 开头时后者会被 sha256sum 当成选项。多出来
        # 的 ./ 前缀要去掉，formula 是按裸文件名查的。
        run: |
          sha256sum ./* | sed 's|\./||' >SHA256SUMS
          cat SHA256SUMS

      - name: Attach the CLI binaries, tarballs and .deb to the release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true

  # 装机验证只能放在发布之后：下面这些资产要先真的存在。这一步红了说明刚发出去的
  # 那一版装不上，得立刻补一个。
  verify-install:
    name: verify (${{ matrix.os }})
    needs: [check, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    env:
      # 不带 token 的 gh / GitHub API 按出口 IP 限流，而 runner 的出口是共用的。
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install the .deb
        if: runner.os == 'Linux'
        run: |
          set -eux
          arch="$(dpkg --print-architecture)"
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "funget_${VERSION}_${arch}.deb" --dir . --clobber
          sudo dpkg -i "funget_${VERSION}_${arch}.deb"
          dpkg -L funget | grep -qx /usr/bin/funget
          funget --version | grep -F "${VERSION}"

      # 走一次公网 HTTPS：release 的下载地址会 302 到
      # objects.githubusercontent.com，所以这一步同时验了静态二进制的证书加载和
      # 重定向跟随，再用 SHA256SUMS 核对收到的字节。
      - name: Download a real asset and check its sum
        if: runner.os == 'Linux'
        run: |
          set -eux
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          asset="funget-$(uname -m)-unknown-linux-musl.tar.gz"
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir . --clobber
          funget info "${base}/${asset}"
          funget download "${base}/${asset}" -o got.tar.gz --silent
          awk -v f="$asset" '$2 == f {print $1}' SHA256SUMS >want.sha
          sha256sum got.tar.gz | awk '{print $1}' >got.sha
          [ -s want.sha ]  # 名字对不上就是清单漏了这个附件，不能静默当成通过
          diff want.sha got.sha

      # 这是整件事的要点：Debian 12 的 glibc 是 2.36，gnu 二进制在这里起不来。
      # 而这个镜像连 ca-certificates 都没有，HTTPS 还能通正说明编进去的 webpki
      # 根证书那条路有效（所以 .deb 里 ca-certificates 是 Recommends 而非 Depends）。
      - name: Install on debian:12-slim
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -eux
          docker run --rm -e VERSION -e GITHUB_REPOSITORY -v "$PWD:/w" -w /w \
            debian:12-slim sh -eux -c '
              dpkg -i "funget_${VERSION}_amd64.deb"
              funget --version
              funget info "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SHA256SUMS"
            '

      # brew install 的验证归 farfarfun/packages —— formula 是那边渲染和推送的，
      # 它的 verify job 本来就是「照 README 真装一遍」的形状。这里只证明 tarball
      # 本身解开能跑（可执行位有没有在 tar 里保住，就看这一步）。
      - name: Unpack the macOS tarball and run it
        if: runner.os == 'macOS'
        run: |
          set -eux
          asset="funget-$(uname -m | sed 's/^arm64$/aarch64/')-apple-darwin.tar.gz"
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir . --clobber
          tar -xzf "$asset"
          ./funget --version | grep -F "${VERSION}"

  # 这里原本有个 notify-packages job，发完版用 PAT 打 repository_dispatch 让
  # farfarfun/packages 立刻重建索引。去掉了：跨仓库写必须带一个长期凭据
  # （workflow 自带的 GITHUB_TOKEN 只对本仓库有效，同组织也不例外），而换来的
  # 只是「apt 里早两小时看到新版」—— 那边每两小时本来就会扫一遍。想立刻
  # 生效就手动触发那边的 build（`gh workflow run build.yml -R farfarfun/packages`），
  # 用的是人的身份，不用在仓库里存 token。

  # crates.io 发布。和 PyPI 那边刻意分开成两个 job：crate 的版本线是独立的 0.x，
  # 多数 tag 根本不会动它，所以这个 job 的常态是「全部跳过」而不是「每次都发」。
  crates:
    needs: [wheels, binaries, sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # 只是允许向 GitHub 索要 OIDC id-token。和 uv 不一样，cargo 自己不做 OIDC
      # 交换 —— 必须靠下面那个 action 把 id-token 换成 crates.io 的短期令牌，
      # 再通过 CARGO_REGISTRY_TOKEN 递给 cargo publish。
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # cargo publish 没有 PyPI 的 --check-url 那种幂等开关，版本已存在就硬失败。
      # 所以逐个 crate 先查 crates.io 再决定发不发：
      #   - crate 版本没变的 tag（大多数情况）→ 两个都跳过，job 绿
      #   - 上次发到一半挂了 → 重跑只补没发出去的那个
      # 顺序写死 funget-core 在前：funget 依赖它，而 crates.io 要求被依赖的
      # 版本在上传时已经存在。
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for pkg in funget-core funget; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')"
            if [ -z "${version}" ]; then
              echo "::error::在 cargo metadata 里找不到 ${pkg}"
              exit 1
            fi
            if curl -sfo /dev/null \
                -H 'User-Agent: farfarfun-funget-release' \
                "https://crates.io/api/v1/crates/${pkg}/${version}"; then
              echo "${pkg} ${version} 已在 crates.io，跳过"
              continue
            fi
            echo "发布 ${pkg} ${version}"
            cargo publish -p "${pkg}" --locked
          done
