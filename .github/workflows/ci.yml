name: CI

# 契约测试（分块切分、跳过已完整文件、上传前校验、日志脱敏、断点续传……）全在
# `cargo test` 里。改造前这个仓库没有任何 CI，测试只在本地跑过；没有自动化就等于
# 没有安全网，所以和 release.yml 一起补上。
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # 钉死 24.04 而不用 ubuntu-latest：该标签从 2026-10-19 起分批迁往 Ubuntu 26
    # (actions/runner-images#14748)。迁移期间同一个标签在不同 job 上可能解析到
    # 不同镜像，差分测试这种依赖系统 Python / glibc 的 job 最容易被坑。
    # 确认 26 上一切正常后再统一改过去。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  differential:
    # 关键安全网：没有保留纯 Python 回退，行为漂移就是下游的线上问题。
    # 新 wheel 和改造前的纯 Python 版跑同一套场景，比对返回值 / 产物 sha256 /
    # 是否建文件。基线取哪个版本见下面那段注释。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5

      - run: pip install "maturin>=1.7,<2"
      - run: maturin build --release --out dist

      # 基线用 1.1.69 而不是改造前 master 上的 1.1.70：1.1.70 只在仓库里打了版本号，
      # 从未发到 PyPI（最新发布版就是 1.1.69），CI 上装不到。两者在下载/上传路径上的
      # 差异只有类型标注现代化、文档字符串和日志脱敏，不影响这里比对的三项可观测行为；
      # 本地已分别对 1.1.69 与 1.1.70 跑过，都是 29/29 一致。
      - name: Differential against funget 1.1.69
        run: python scripts/differential.py --baseline "funget==1.1.69"
