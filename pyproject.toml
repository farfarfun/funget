[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funget"
version = "1.1.70"
description = "Concurrent HTTP downloads and uploads for Python"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "download", "upload", "http", "range-requests",]
classifiers = ["Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = [ "funfile>=1.0.39", "farlog>=1.1.7", "funworker>=0.1.3", "requests>=2.30.0", "urllib3>=2.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funget = "funget.script:funget"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funget"
Releases = "https://github.com/farfarfun/funget/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/funget"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [ "BLE001", "FA100",]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "SIM117",]
