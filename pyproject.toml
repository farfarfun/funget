[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "funget"
version = "1.1.70"
description = "Concurrent HTTP downloads and uploads for Python"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "download", "upload", "http", "range-requests",]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]
# 零运行时依赖:实现全在 Rust 扩展里,funfile / farlog / funworker / requests /
# typer / urllib3 全部消失。
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funget = "funget:_cli"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funget"
Releases = "https://github.com/farfarfun/funget/releases"

[tool.maturin]
# abi3-py312:一个 wheel 覆盖 3.12 及以后所有版本,发布矩阵因此减半。
features = ["pyo3/abi3-py312"]
module-name = "funget._funget"
python-source = "python"
# 根 crate(funget-py)才是扩展模块,workspace 里另外两个 crate 不参与打包。
manifest-path = "Cargo.toml"
strip = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [ "BLE001", "FA100",]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "SIM117",]
