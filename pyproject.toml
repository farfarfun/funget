[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "funget"
version = "1.1.71"
description = "Concurrent HTTP downloads and uploads for Python"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "download", "upload", "http", "range-requests",]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]
# 零运行时依赖:实现全在 Rust 扩展里,funfile / farlog / funworker / requests /
# typer / urllib3 全部消失。
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funget = "funget:_cli"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funget"
Releases = "https://github.com/farfarfun/funget/releases"

[tool.maturin]
# abi3-py312:一个 wheel 覆盖 3.12 及以后所有版本,发布矩阵因此减半。
features = ["pyo3/abi3-py312"]
module-name = "funget._funget"
python-source = "src"
# 工作区是纯虚拟的(根目录没有 [package]),所以必须显式指向扩展模块那个 crate,
# 否则 maturin 不知道该打包哪一个。
manifest-path = "crates/funget-py/Cargo.toml"
strip = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [ "BLE001", "FA100",]
