[build-system]
requires = [ "setuptools>=83.0.0",]
build-backend = "setuptools.build_meta"

[project]
name = "funget"
version = "1.1.63"
description = "Concurrent HTTP downloads and uploads for Python"
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "download", "upload", "http", "range-requests",]
classifiers = [ "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only",]
dependencies = [ "funfile>=1.0.39", "nltlog>=1.1.6", "requests>=2.30.0", "urllib3>=2.0",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.license]
file = "LICENSE"

[project.scripts]
funget = "funget.script:funget"

[project.urls]
Homepage = "https://github.com/farfarfun/funget"
Repository = "https://github.com/farfarfun/funget"
Issues = "https://github.com/farfarfun/funget/issues"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [ "BLE001", "FA100",]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "SIM117",]
