[package]
name = "funget-core"
# 工作区里唯一不跟 workspace 版本走的 crate:独立的 0.x 线。下面 9 个 `pub mod`
# 之所以是 public,是为了让 funget / funget-py 跨 crate 调用,并不是按「公共
# Rust API」设计的。0.x 下这些模块还能重构,1.x 就锁死了。
#
# crates/funget 相反 —— 它的 clap `--version` 必须和 PyPI 同号,所以写
# `version.workspace = true`。详见该 crate 的 Cargo.toml 注释。
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Concurrent HTTP download/upload engine behind funget"
readme = "README.md"
keywords = ["download", "upload", "http", "range", "resume"]
categories = ["network-programming", "web-programming::http-client", "asynchronous"]

[dependencies]
futures-util.workspace = true
indicatif.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
