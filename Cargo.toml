# 纯虚拟工作区:根目录不再是一个 crate。三个 crate 全部在 crates/ 下,
# 顶层 src/ 让给 Python 包(src layout)。这样「哪个目录是谁的」不再有歧义 ——
# Rust 看 crates/,Python 看 src/。
[workspace]
members = ["crates/funget-core", "crates/funget", "crates/funget-py"]
resolver = "2"

[workspace.package]
# crates/funget-py(PyO3 扩展)和 crates/funget(CLI 二进制)跟这个号走。前者必须
# 和 pyproject.toml 一致;后者同号是为了「一个版本号对应一次 release、一套附件、
# 一个 wheel」—— 1.2.0 之前这是硬约束(pip 也会装出 funget 命令,两条渠道的
# `--version` 必须一致),现在是约定。由 funbuild 在发版时同步写入。
#
# crates/funget-core 例外:它作为库发到 crates.io,维护独立的 0.x 版本线,不写
# `version.workspace = true`。详见该 crate 的 Cargo.toml 注释。
version = "1.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/farfarfun/funget"
rust-version = "1.82"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
# 必须带 version:crates.io 不收 path 依赖,`cargo publish` 会在打包时把 path
# 去掉、只留版本约束。缺这一项 `cargo publish -p funget` 直接报
# 「all dependencies must have a version requirement specified when publishing」。
funget-core = { path = "crates/funget-core", version = "0.2.0" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indicatif = "0.17"
log = "0.4"
# 不开 gzip/deflate:requests 默认带 Accept-Encoding,而 funget 又拿解码后的字节数
# 去比对 Content-Length,一旦服务端真的压缩就会判定「下载不完整」。不声明支持压缩
# 直接消掉这个历史隐患,对下载文件也没有损失。
reqwest = { version = "0.12", default-features = false, features = [
    # 两套根证书**同时**开。reqwest 的 `async_impl/client.rs` 里这是两个独立的
    # `#[cfg]` 分支,往同一个 `RootCertStore` 里塞证书,开关默认都是 true,所以
    # 开了就是取并集 —— 不需要任何代码配合。
    #
    # 只开 webpki 等于「只信 Mozilla 那份固定列表」:企业私有 CA、内网自签、公司
    # MITM 代理的证书一律连不上,而同一台机器上的 curl 是通的(它读系统证书库)。
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
    # socks 的实现内联在 reqwest 的 connect.rs 里,这个 feature 不拉任何新 crate,
    # 换来 `--proxy socks5://` / `socks5h://` 的支持。
    "socks",
    "stream",
    "multipart",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
